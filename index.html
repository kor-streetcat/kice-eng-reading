<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평가원 영어 독해 기출</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기출 독해">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>try{const t=localStorage.getItem('KICE:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
[hidden]{display:none!important}img{max-width:100%}

/* Δ UI (Delta UI) — tokens copied from the system's starter. App layout: sticky top bar with view pills; question sheet sized to the screen height; answer controls in a bottom bar (portrait) or a right column (landscape). */
:root{
  --bg:#ffffff; --sidebar:#f7f7f5; --hover:#efefed; --border:#e9e9e7;
  --ink:#37352f; --ink-dim:#787774; --ink-faint:#a3a19c;
  --accent:#2383e2; --accent-hover:#1b74cc; --accent-soft:#2383e21a;
  --danger:#eb5757; --danger-soft:#fdebec;
  --topbar-bg:rgba(255,255,255,0.92); --toast-action:#8fc2ff;
  --tbg-blue:#d3e5ef; --tfg-blue:#183347; --tbg-purple:#e8deee; --tfg-purple:#412454;
  --tbg-green:#dbeddb; --tfg-green:#1c3829; --tbg-yellow:#fdecc8; --tfg-yellow:#402c1b;
  --tbg-pink:#f5e0e9; --tfg-pink:#4c2337; --tbg-orange:#fadec9; --tfg-orange:#49290e;
  --tbg-gray:#e3e2e0; --tfg-gray:#32302c;
  --success:var(--tfg-green); --success-soft:var(--tbg-green);
  --radius:10px;
  --shadow-bar:0 1px 2px rgba(15,15,15,0.04); --shadow-toast:0 8px 28px rgba(0,0,0,0.25); --shadow-dialog:0 18px 60px rgba(0,0,0,0.28);
  --ease-out:cubic-bezier(0.22,1,0.36,1); --sheet:cubic-bezier(0.32,0.72,0,1);
  --spring-bounce:cubic-bezier(0.34,1.3,0.64,1);
  --font-sans:'Hanken Grotesk','Inter',-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;
  /* app-only meaning colors (named here, not in the shared tokens) */
  --mark:rgba(250,212,120,0.55); --mark-line:#d9a520;   /* 근거 밑줄 */
  --img-filter:none; --on-accent:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;   /* 정답 번호 5개 계열 */
  color-scheme:light;
}
@supports (transition-timing-function: linear(0, 1)){:root{
  --spring-bounce:linear(0,0.016,0.0584,0.1196,0.1933,0.2742,0.3583,0.4422,0.5233,0.5999,0.6706,0.7347,0.7918,0.8418,0.8848,0.9212,0.9514,0.9759,0.9954,1.0104,1.0216,1.0294,1.0345,1.0374,1.0384,1.038,1.0365,1.0343,1.0315,1.0285,1.0252,1.022,1.0189,1.0159,1.0131,1.0106,1.0084,1.0064,1.0047,1.0033,1)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --sidebar:#202020; --hover:#2b2b2b; --border:#2f2f2f; --ink:#e6e6e4; --ink-dim:#9b9a97; --ink-faint:#6f6e6b;
  --accent:#529cca; --accent-hover:#6aaad4; --accent-soft:#529cca2e; --danger:#ff7369; --danger-soft:#ff736929;
  --topbar-bg:rgba(25,25,25,0.92); --toast-action:#1a5fb4;
  --tbg-blue:#1f3a4d; --tfg-blue:#a9d0ea; --tbg-purple:#3a2b4d; --tfg-purple:#d4b8e6; --tbg-green:#24402c; --tfg-green:#a6d3b0;
  --tbg-yellow:#4a3b1f; --tfg-yellow:#eccb85; --tbg-pink:#4a2b3b; --tfg-pink:#e8b6cc; --tbg-orange:#4d3320; --tfg-orange:#eab98e;
  --tbg-gray:#3a3a3a; --tfg-gray:#c9c9c9;
  --mark:rgba(236,203,133,0.28); --mark-line:#eccb85; --img-filter:invert(.9) hue-rotate(180deg); --on-accent:#191919;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --sidebar:#202020; --hover:#2b2b2b; --border:#2f2f2f; --ink:#e6e6e4; --ink-dim:#9b9a97; --ink-faint:#6f6e6b;
  --accent:#529cca; --accent-hover:#6aaad4; --accent-soft:#529cca2e; --danger:#ff7369; --danger-soft:#ff736929;
  --topbar-bg:rgba(25,25,25,0.92); --toast-action:#1a5fb4;
  --tbg-blue:#1f3a4d; --tfg-blue:#a9d0ea; --tbg-purple:#3a2b4d; --tfg-purple:#d4b8e6; --tbg-green:#24402c; --tfg-green:#a6d3b0;
  --tbg-yellow:#4a3b1f; --tfg-yellow:#eccb85; --tbg-pink:#4a2b3b; --tfg-pink:#e8b6cc; --tbg-orange:#4d3320; --tfg-orange:#eab98e;
  --tbg-gray:#3a3a3a; --tfg-gray:#c9c9c9;
  --mark:rgba(236,203,133,0.28); --mark-line:#eccb85; --img-filter:invert(.9) hue-rotate(180deg); --on-accent:#191919;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-x:none;word-break:keep-all}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.2em;height:1.2em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.24em}

button{font:inherit;font-size:0.85rem;font-weight:500;border:none;border-radius:var(--radius);padding:8px 12px;cursor:pointer;color:inherit;
  transition:background-color .22s var(--ease-out),border-color .22s var(--ease-out),color .22s var(--ease-out),opacity .22s var(--ease-out),scale .55s var(--spring-bounce)}
button:active{scale:0.96;transition-duration:.22s,.22s,.22s,.22s,.14s}
button:disabled{opacity:.45;cursor:default}
button:disabled:active{scale:1}
.btn-main{background:var(--accent);color:#fff;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink-dim)}
.btn-ghost.active{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
@media (hover:hover){.btn-main:not(:disabled):hover{background:var(--accent-hover)}.btn-ghost:not(:disabled):hover{background:var(--hover);color:var(--ink)}}
.btn-main,.btn-ghost{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:0.78rem;color:var(--ink-dim);min-height:34px}
.chip.selected{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:500}
@media (hover:hover){.chip:not(.selected):hover{background:var(--hover)}}
.chip .c{font-size:0.72rem;opacity:.75;font-variant-numeric:tabular-nums}
.tag{display:inline-block;line-height:1.5;padding:1px 8px;border-radius:999px;font-size:0.7rem;font-weight:500;background:var(--tbg,var(--tbg-gray));color:var(--tfg,var(--tfg-gray));white-space:nowrap}
.g-blue{--tbg:var(--tbg-blue);--tfg:var(--tfg-blue)} .g-purple{--tbg:var(--tbg-purple);--tfg:var(--tfg-purple)}
.g-green{--tbg:var(--tbg-green);--tfg:var(--tfg-green)} .g-yellow{--tbg:var(--tbg-yellow);--tfg:var(--tfg-yellow)}
.g-pink{--tbg:var(--tbg-pink);--tfg:var(--tfg-pink)} .g-orange{--tbg:var(--tbg-orange);--tfg:var(--tfg-orange)} .g-gray{--tbg:var(--tbg-gray);--tfg:var(--tfg-gray)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:0.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--hover);color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge .ic{width:12px;height:12px;vertical-align:0}
.st-ok{background:var(--success-soft);color:var(--success)} .st-bad{background:var(--danger-soft);color:var(--danger)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--topbar-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 16px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-size:1.12rem;font-weight:700;letter-spacing:-0.01em;white-space:nowrap}
.brand .ic{color:var(--accent);width:22px;height:22px;vertical-align:0}
.pills{display:flex;gap:2px;padding:3px;background:var(--sidebar);border-radius:14px}
.pill{height:34px;min-width:34px;padding:0 9px;border-radius:11px;background:transparent;color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600}
.pill .ic{width:17px;height:17px;vertical-align:0}
.pill.active{background:var(--hover);color:var(--ink)}
@media (hover:hover){.pill:not(.active):hover{background:var(--hover);color:var(--ink)}}
.sp{flex:1}
.qhead{display:flex;align-items:center;gap:8px;min-width:0}
.qhead b{font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.qhead .exn{color:var(--ink-dim);font-size:0.85rem;white-space:nowrap}
.iconbtn{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;background:transparent;color:var(--ink-dim)}
@media (hover:hover){.iconbtn:hover{background:var(--hover);color:var(--ink)}}
@media (max-width:640px){.brand span,.pill .lbl,.qhead .exn{display:none}}

/* page */
.page{max-width:1080px;margin:0 auto;padding:32px 16px 72px;display:grid;gap:24px}
@media (min-width:900px){.page{padding:48px 48px 80px}}
.page-title{display:flex;align-items:center;gap:10px;font-size:2rem;font-weight:700;letter-spacing:-0.02em;line-height:1.3;margin:0;text-wrap:balance}
.page-title .ic{width:2rem;height:2rem;color:var(--accent);stroke-width:1.5}
.lede{margin:6px 0 0;color:var(--ink-dim);font-size:0.9rem;max-width:62ch}
.stats-row{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.stat span{font-size:0.72rem;color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.label{font-size:0.7rem;font-weight:600;letter-spacing:0.02em;color:var(--ink-dim);margin-right:6px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;min-width:0}
.card-pad{padding:16px 18px}
.card h2{font-size:0.94rem;font-weight:600;margin:0}
.card .sub{font-size:0.72rem;color:var(--ink-dim);margin:2px 0 14px}
.tscroll{overflow-x:auto}

/* question grid */
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:690px}
.grid th,.grid td{padding:5px 2px;text-align:center}
.grid thead th{font-size:0.72rem;font-weight:600;color:var(--ink-dim);font-variant-numeric:tabular-nums;padding-top:12px;border-bottom:1px solid var(--border)}
.grid tbody th{text-align:left;padding-left:16px;padding-right:8px;font-size:0.85rem;font-weight:600;white-space:nowrap}
.grid tbody tr+tr>*{border-top:1px solid var(--border)}
.grid .gap{width:8px}
.cell{width:clamp(30px,3.4vw,38px);height:clamp(30px,3.4vw,38px);padding:0;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--ink-dim);font-size:0.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--success-soft);border-color:transparent;color:var(--success)}
.cell.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.cell.dim{opacity:.28}
@media (hover:hover){.cell:not(.ok):not(.bad):hover{background:var(--hover);color:var(--ink)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:0.72rem;color:var(--ink-dim);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--border);margin-right:6px;vertical-align:-2px}
.legend i.ok{background:var(--success-soft);border-color:transparent} .legend i.bad{background:var(--danger-soft);border-color:transparent}
.foot{font-size:0.72rem;color:var(--ink-dim);margin:0}
.linkbtn{background:none;padding:0;color:var(--accent);font-size:inherit;text-decoration:underline;text-underline-offset:2px}

/* question view */
.qv{max-width:1400px;margin:0 auto;padding:12px 16px calc(var(--strip-h,76px) + 16px);display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.sheet{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0;display:flex;justify-content:center}
.figure{position:relative;max-width:100%}
.figure img{display:block;width:100%;height:auto;filter:var(--img-filter)}
.hl{position:absolute;background:var(--mark);border-bottom:2px solid var(--mark-line);border-radius:2px;pointer-events:none;animation:markin .45s var(--ease-out) both}
@keyframes markin{from{opacity:0;transform:scaleX(.6);transform-origin:left}to{opacity:1;transform:none}}
.side{display:grid;gap:12px;align-content:start;min-width:0}
.panel{display:grid;gap:14px}
.clockbtn{min-height:34px;padding:4px 12px;border-radius:999px;background:var(--hover);color:var(--ink-dim);font-size:0.78rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.clockbtn .ic{width:13px;height:13px;vertical-align:0}
.clockbtn.idle{background:var(--accent);color:#fff}
.clockbtn.run{background:var(--accent-soft);color:var(--accent)}
.clockbtn.done,.clockbtn.done:disabled{cursor:default;opacity:1}
/* portrait, answer shown: panel sits under the sheet with a capped height and scrolls inside; the sheet shrinks to keep the whole question on screen */
.qv:not(.wide).revealed .panel{overflow:auto;overscroll-behavior:contain}
@media (min-width:700px){.qv:not(.wide) .panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;align-items:start}
  .qv:not(.wide) .panel>.verdict,.qv:not(.wide) .panel>.row,.qv:not(.wide) .panel>.ev{grid-column:1/-1}}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict .big{font-size:1.02rem;font-weight:700;padding:3px 12px;border-radius:999px}
.verdict .meta{font-size:0.85rem;color:var(--ink-dim)}
.verdict .meta b{color:var(--ink);font-weight:600}
.sec h3{font-size:0.7rem;font-weight:600;letter-spacing:0.02em;color:var(--ink-dim);margin:0 0 4px}
.sec p{margin:0;font-size:0.9rem;line-height:1.6}
.ev{background:var(--sidebar);border-radius:20px;padding:12px 14px}
.ev p{font-size:0.9rem}
.ev mark{background:var(--mark);color:inherit;box-shadow:inset 0 -2px 0 var(--mark-line);padding:0 1px;border-radius:2px}
.sec.tr p{color:var(--ink-dim)}

/* answer controls */
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubbles{display:flex;gap:8px}
.bubble{width:48px;height:48px;padding:0;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);color:var(--ink-dim);font-size:1.15rem;font-weight:500;display:grid;place-items:center}
.bubble[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bubble.correct{background:var(--success-soft);border-color:transparent;color:var(--success);font-weight:700}
.bubble.wrong{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:700}
.bubble:disabled{opacity:1}
.navbtns{display:flex;gap:8px;margin-left:auto}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--topbar-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.strip .ctrl{max-width:1400px;margin:0 auto;padding:12px 16px}
@media (max-width:600px){.bubble{width:42px;height:42px}.navbtns{margin-left:0;width:100%}.navbtns>*{flex:1}}
/* landscape tablets: controls move to a right column so the sheet gets the full height */
.qv.wide{grid-template-columns:minmax(0,1fr) 340px;align-items:start;padding-bottom:16px;overflow:hidden}
.qv.wide .side{max-height:100%;overflow:auto;overscroll-behavior:contain;padding-bottom:4px}
.qv.wide .sheet{max-height:100%}
.qv.wide .side .ctrl{flex-direction:column;align-items:stretch}
.qv.wide .side .bubbles{justify-content:space-between}
.qv.wide .side .navbtns{margin-left:0}
.qv.wide .side .navbtns>*{flex:1}

/* toast + dialog (Δ UI) */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;width:max-content;max-width:min(440px,calc(100vw - 32px));padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:0.86rem;box-shadow:var(--shadow-toast);
  opacity:0;visibility:hidden;transform:translate(-50%,22px) scale(0.94);transition:opacity .35s var(--ease-out),transform .6s var(--spring-bounce),visibility .35s var(--ease-out)}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.dlg-overlay{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,15,15,0.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg-overlay.open{display:flex}
.dlg{width:min(340px,100%);background:var(--sidebar);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow-dialog);padding:24px 16px 16px;animation:popIn .58s var(--spring-bounce)}
.dlg-msg{margin:0 8px 20px;font-size:1.02rem;line-height:1.55}
.dlg-btn{width:100%;min-height:50px;border-radius:999px;background:var(--hover);color:var(--ink);font-size:1rem;margin-top:8px}
.dlg-btn.destructive{color:var(--danger)}
@keyframes popIn{from{opacity:0;transform:scale(0.9)}40%{opacity:1}to{opacity:1;transform:none}}

/* answer distribution */
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tot{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;height:200px;position:relative}
.tot .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.tot .b{width:min(52px,70%);background:var(--accent);border-radius:4px 4px 0 0}
.tot .v{font-size:0.94rem;font-weight:600;font-variant-numeric:tabular-nums}
.tot .k{font-size:1.1rem;color:var(--ink-dim)}
.tot .p{font-size:0.72rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.exp{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-dim);pointer-events:none}
.exp span{position:absolute;right:0;top:-20px;font-size:0.7rem;color:var(--ink-dim);background:var(--bg);padding:0 4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-dim);font:12px var(--font-sans);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.chart .dot{stroke:var(--bg);stroke-width:2}
.chart .lab{font-weight:600;fill:var(--ink)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:0.85rem;margin-bottom:8px}
.legend2 i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:4px}
table.dt{border-collapse:collapse;width:100%;font-size:0.85rem;font-variant-numeric:tabular-nums}
.dt th,.dt td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.dt thead th{font-size:0.7rem;font-weight:600;color:var(--ink-dim)}
.dt tbody th{text-align:left;font-weight:600}
.dt .key{font-size:1rem}
.dt .alt{display:block;margin-top:2px}
.dt tr.sum>*{border-top:2px solid var(--ink);font-weight:700}
.heat td.h{border:2px solid var(--bg);border-radius:8px;min-width:42px;font-weight:600}

function offlineStatus(){
  const el=$('#offl'); if(!el) return;
  if(!('caches' in window)||!('serviceWorker' in navigator)){el.textContent='이 브라우저는 오프라인 저장을 지원하지 않습니다';return}
  caches.open(CACHE).then(c=>c.keys()).then(ks=>{
    const n=ks.filter(r=>/\/img\/q\d{3}\.webp$/.test(new URL(r.url).pathname)).length;
    const shell=ks.some(r=>/\/(index\.html)?$/.test(new URL(r.url).pathname));
    if(n>=136&&shell){el.className='badge st-ok';el.textContent='오프라인 준비 완료'}
    else{el.className='badge';el.textContent=`오프라인 준비 중 · 문제 ${n}/136`;clearTimeout(offlineStatus.h);offlineStatus.h=setTimeout(offlineStatus,1500)}
  }).catch(()=>{el.textContent='오프라인 준비 상태를 확인할 수 없습니다'})}

let cur=null,pick=0,tick=null,peek=false,acc=0,runAt=0;
const elapsed=()=>acc+(runAt?Date.now()-runAt:0);
function stopClock(){if(runAt){acc+=Date.now()-runAt;runAt=0}clearInterval(tick);tick=null}
function paintClock(){const b=$('#clock');if(!b||!cur)return;const r=rec[cur.i];
  if(r||peek){b.className='clockbtn done';b.disabled=true;b.innerHTML=`${icon('clock')}${r&&r.ms?fmt(r.ms):(elapsed()?fmt(elapsed()):'–')}`;b.setAttribute('aria-label','풀이 시간');return}
  b.disabled=false;
  if(runAt){b.className='clockbtn run';b.innerHTML=`${icon('pause')}${fmt(elapsed())}`;b.setAttribute('aria-label','타이머 일시정지')}
  else if(acc){b.className='clockbtn';b.innerHTML=`${icon('play')}${fmt(acc)}`;b.setAttribute('aria-label','타이머 계속')}
  else{b.className='clockbtn idle';b.innerHTML=`${icon('play')}시작`;b.setAttribute('aria-label','타이머 시작')}}
function toggleClock(){if(!cur||rec[cur.i]||peek)return;
  if(runAt){stopClock()}else{runAt=Date.now();clearInterval(tick);tick=setInterval(paintClock,1000)}paintClock()}
const isWide=()=>innerWidth>=1000&&innerWidth>innerHeight;
function open(i,direct){
  const q=Q[i]; cur=q; const r=rec[i];
  if(direct&&!inList(q)){ui.filter='전체';ui.wrongOnly=false;saveUi()}
  pick=r?r.pick:0; peek=false; stopClock(); acc=0; runAt=0;
  setHash(null,'',location.pathname+location.search+'#'+q.id);
  const L=list(),k=L.indexOf(q);
  topbar('',`<div class="qhead"><b>${q.n}번</b><span class="exn">${esc(q.ex)}</span>${tag(q.g)}</div><div class="sp"></div>
    <button class="clockbtn" id="clock"></button><span class="badge">${k+1}/${L.length}</span>
    <button class="iconbtn ${ui.big?'':''}" id="fitbtn" aria-pressed="${ui.big}" title="${ui.big?'한 화면에 맞추기':'폭에 맞춰 크게 보기'}" aria-label="${ui.big?'한 화면에 맞추기':'폭에 맞춰 크게 보기'}">${icon('fit')}</button>`);
  $('#clock').onclick=toggleClock;
  $('#fitbtn').onclick=()=>{ui.big=!ui.big;saveUi();open(q.i)};
  const wide=isWide();
  $('#main').innerHTML=`<section class="qv ${wide?'wide':''}" id="qv">
    <div class="sheet"><div class="figure" id="fig"><img src="img/${q.id}.webp" width="${q.w}" height="${q.h}" alt="${esc(q.ex)} ${q.n}번 문제(${esc(q.t)})"></div></div>
    <aside class="side" id="side">${wide?'<div class="card card-pad"><div class="ctrl" id="ctrlbox"></div></div>':''}<div class="card card-pad panel" id="panel" hidden></div></aside></section>`;
  $('#strip').hidden=wide;
  renderCtrl();
  fit(); removeEventListener('resize',fit); addEventListener('resize',fit);
  paintClock(); if(r) reveal(false);
  const nx=L[k+1]; if(nx){const im=new Image();im.src=`img/${nx.id}.webp`}
  scrollTo(0,0);
}
/* size the sheet so the whole question shows at once */
function fit(){
  if(!cur) return;
  const wide=isWide(), qv=$('#qv'); if(!qv) return;
  if(wide!==qv.classList.contains('wide')){open(cur.i);return}
  const strip=$('#strip'); const sh=wide?0:strip.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--strip-h',sh+'px');
  const top=$('.top').getBoundingClientRect().height;
  const sheet=$('.sheet'), cs=getComputedStyle(sheet);
  const padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+2, padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+2;
  const availW=sheet.clientWidth-padX+2;
  let availH=innerHeight-top-sh-24-padY;
  const panel=$('#panel');
  if(!wide&&panel&&!panel.hidden){
    panel.style.maxHeight='none';
    const nat=panel.scrollHeight+2, cap=Math.round((availH-16)*0.34);
    const ph=Math.min(nat,cap); panel.style.maxHeight=ph+'px';
    availH-=ph+16;
  }else if(panel) panel.style.maxHeight='';
  const fig=$('#fig'); let w=availW;
  if(!ui.big) w=Math.min(availW,availH*cur.w/cur.h);
  w=Math.min(w,900);
  fig.style.width=Math.floor(w)+'px';
  if(wide){qv.style.height=(innerHeight-top)+'px';}else qv.style.height='';
  /* correct for anything the estimate missed so the page itself never scrolls */
  if(!ui.big) for(let k=0;k<3;k++){
    const over=document.documentElement.scrollHeight-innerHeight;
    if(over<=0) break;
    w=Math.max(120,w-(over+1)*cur.w/cur.h); fig.style.width=Math.floor(w)+'px';
  }
}
function renderCtrl(){
  const q=cur,r=rec[q.i],L=list(),k=L.indexOf(q);
  const lock=!!r||peek;
  const html=`<div class="bubbles" role="group" aria-label="답 고르기">${[1,2,3,4,5].map(c=>{let cls='';if(r){if(c===q.a)cls='correct';else if(c===r.pick)cls='wrong'}else if(peek&&c===q.a)cls='correct';
      return `<button class="bubble ${cls}" data-c="${c}" aria-pressed="${!lock&&pick===c}" ${lock?'disabled':''} aria-label="${c}번">${CIR[c]}</button>`}).join('')}</div>
    <div class="navbtns"><button class="btn-ghost" id="prev" ${k<=0?'disabled':''} aria-label="이전 문항">${icon('prev')}이전</button>
      ${r?`<button class="btn-ghost" id="retry">다시 풀기</button><button class="btn-main" id="next" ${k>=L.length-1?'disabled':''}>다음 문항${icon('next')}</button>`
       :peek?`<button class="btn-ghost" id="unpeek">해설 닫기</button><button class="btn-main" id="next" ${k>=L.length-1?'disabled':''}>다음 문항${icon('next')}</button>`
         :`<button class="btn-ghost" id="peek">해설</button><button class="btn-main" id="grade" ${pick?'':'disabled'}>채점</button><button class="btn-ghost" id="next" ${k>=L.length-1?'disabled':''} aria-label="건너뛰기">${icon('next')}</button>`}</div>`;
  const box=$('#ctrlbox')||$('#stripin'); box.innerHTML=html;
  box.querySelectorAll('.bubble:not([disabled])').forEach(b=>b.onclick=()=>{pick=+b.dataset.c;renderCtrl()});
  $('#prev').onclick=()=>go(-1); $('#next').onclick=()=>go(1);
  const g=$('#grade'); if(g) g.onclick=grade;
  const rt=$('#retry'); if(rt) rt.onclick=()=>{delete rec[q.i];save();open(q.i)};
  const pk=$('#peek'); if(pk) pk.onclick=()=>{peek=true;stopClock();renderCtrl();reveal(true)};
  const up=$('#unpeek'); if(up) up.onclick=()=>open(q.i);
}
function go(d){const L=list(),k=L.indexOf(cur),n=L[k+d];if(n)open(n.i);else if(d>0)toast('이 목록의 마지막 문항입니다.')}
function grade(){if(!pick)return;const q=cur;stopClock();const ms=acc||undefined;rec[q.i]={pick,ok:pick===q.a,ms,at:Date.now()};save();renderCtrl();reveal(true)}
function reveal(fresh){
  const q=cur,r=rec[q.i];
  paintClock(); $('#qv').classList.add('revealed');
  $('#fig').insertAdjacentHTML('beforeend',q.hp.map(([x,y,w,h],j)=>`<span class="hl" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;animation-delay:${j*40}ms"></span>`).join(''));
  const p=$('#panel'); p.hidden=false;
  const ev=esc(q.ev).replace(/“([^”]+)”/g,'“<mark>$1</mark>”');
  p.innerHTML=`${r?`<div class="verdict"><span class="big ${r.ok?'st-ok':'st-bad'}">${r.ok?'정답':'오답'}</span>
      <span class="meta">정답 <b>${CIR[q.a]}</b> · 내 답 <b>${CIR[r.pick]}</b>${r.ms?` · ${fmt(r.ms)}`:''}</span></div>`
    :`<div class="verdict"><span class="big st-ok">정답 ${CIR[q.a]}</span><span class="meta">풀지 않고 해설을 봤습니다. 기록에는 남지 않습니다.</span></div>`}
    <div class="row">${tag(q.g)}${q.t!==q.g?`<span class="badge">${esc(q.t)}</span>`:''}${q.f?`<span class="badge">역대 최빈 ${esc(q.f)}</span>`:''}</div>
    <div class="sec ev"><h3>정답 근거 · 지문 밑줄</h3><p>${ev}</p></div>
    <div class="sec"><h3>정답이 나오는 논리</h3><p>${esc(q.lg)}</p></div>
    ${q.tr?`<div class="sec tr"><h3>오답·함정</h3><p>${esc(q.tr)}</p></div>`:''}`;

function stats(){
  leave(); setHash(null,'',location.pathname+location.search+'#answers');
  topbar('stats','<div class="sp"></div>');
  const K=[1,2,3,4,5],S=k=>`var(--s${k})`,JS=['','이','가','이','가','가'];
  const cnt=qs=>{const c=[0,0,0,0,0,0];qs.forEach(q=>c[q.a]++);return c};
  const total=cnt(Q),N=Q.length,exp=N/5;
  const even=Q.filter(q=>/짝수형 정답/.test(q.f)).map(q=>({q,alt:q.f.match(/짝수형 정답\s*(\S)/)[1]}));
  const max=Math.max(...K.map(k=>total[k]),exp)*1.12;
  const totHtml=`<div class="tot">${K.map(k=>`<div class="col" title="${CIR[k]} ${total[k]}문항"><span class="v">${total[k]}</span><span class="b" style="height:${total[k]/max*140}px"></span><span class="k">${CIR[k]}</span><span class="p">${(total[k]/N*100).toFixed(1)}%</span></div>`).join('')}
    <div class="exp" style="bottom:${60+exp/max*140}px"><span>균등할 때 ${exp.toFixed(1)}</span></div></div>`;
  const cum=[],run=[0,0,0,0,0,0];
  EXAMS.forEach(ex=>{Q.filter(q=>q.ex===ex).forEach(q=>run[q.a]++);cum.push(run.slice())});
  const W=640,H=300,L=36,R=60,T=14,B=40,ymax=Math.ceil(Math.max(...cum.at(-1))/5)*5;
  const x=i=>L+i*(W-L-R)/(EXAMS.length-1),y=v=>T+(1-v/ymax)*(H-T-B);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="회차가 쌓일 때 번호별 누적 정답 수">`;
  for(let v=0;v<=ymax;v+=5)svg+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  EXAMS.forEach((ex,i)=>svg+=`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${ex}</text>`);
  svg+=`<line x1="${x(0)}" y1="${y(17/5)}" x2="${x(EXAMS.length-1)}" y2="${y(exp)}" stroke="var(--ink-dim)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  K.forEach(k=>svg+=`<polyline class="ln" stroke="${S(k)}" points="${cum.map((c,i)=>x(i)+','+y(c[k])).join(' ')}"/>`);
  K.forEach(k=>cum.forEach((c,i)=>svg+=`<circle class="dot" cx="${x(i)}" cy="${y(c[k])}" r="4" fill="${S(k)}"><title>${EXAMS[i]}까지 ${CIR[k]} ${c[k]}문항</title></circle>`));
  const ends=K.map(k=>({k,v:cum.at(-1)[k],yy:y(cum.at(-1)[k])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<15)ends[i].yy=ends[i-1].yy+15;
  ends.forEach(e=>svg+=`<text class="lab" x="${W-R+10}" y="${e.yy+4}">${CIR[e.k]} ${e.v}</text>`);
  svg+='</svg>';
  const th5=K.map(k=>`<th>${CIR[k]}</th>`).join('');
  const cumTable=`<div class="tscroll"><table class="dt"><thead><tr><th>회차까지 누적</th>${th5}<th>문항</th></tr></thead><tbody>${cum.map((c,i)=>`<tr><th>${EXAMS[i]}</th>${K.map(k=>`<td>${c[k]}</td>`).join('')}<td>${17*(i+1)}</td></tr>`).join('')}</tbody></table></div>`;
  const exRows=EXAMS.map(ex=>{const c=cnt(Q.filter(q=>q.ex===ex)),mx=Math.max(...K.map(k=>c[k]));return `<tr><th>${ex}</th>${K.map(k=>`<td style="${c[k]===mx?'font-weight:700':'color:var(--ink-dim)'}">${c[k]}</td>`).join('')}</tr>`}).join('');
  const keyRows=EXAMS.map(ex=>`<tr><th>${ex}</th>${Q.filter(q=>q.ex===ex).map(q=>{const e=even.find(z=>z.q===q);return `<td><span class="key">${CIR[q.a]}</span>${e?`<span class="alt"><span class="tag g-orange" title="짝수형 정답">짝 ${e.alt}</span></span>`:''}</td>`}).join('')}</tr>`).join('');
  const heat=NUMS.map(n=>{const c=cnt(Q.filter(q=>q.n===n));return `<tr><th>${n}번 ${tag(GROUP(n))}</th>${K.map(k=>{const p=c[k]/8;
    return `<td class="h" title="${n}번 정답이 ${CIR[k]}인 회차 ${c[k]}/8" style="background:color-mix(in srgb,var(--accent) ${Math.round(p*100)}%,var(--sidebar));color:${p>=.5?'var(--on-accent)':c[k]?'var(--ink)':'var(--ink-faint)'}">${c[k]||'·'}</td>`}).join('')}</tr>`}).join('');
  const typeRows=GROUPS.map(g=>{const qs=Q.filter(q=>q.g===g),c=cnt(qs);return `<tr><th>${tag(g)}</th>${K.map(k=>`<td>${c[k]}</td>`).join('')}<td>${qs.length}</td></tr>`}).join('');
  let pairs=0,same=0;EXAMS.forEach(ex=>{const s=Q.filter(q=>q.ex===ex);for(let i=1;i<s.length;i++)if(s[i].n-s[i-1].n===1){pairs++;if(s[i].a===s[i-1].a)same++}});
  const top=K.reduce((a,k)=>total[k]>total[a]?k:a,1),low=K.reduce((a,k)=>total[k]<total[a]?k:a,1);
  $('#main').innerHTML=`<section class="page">

      <p class="lede">8회분 × 17문항(21–24번, 30–42번)의 정답 번호만 모아 센 결과입니다. 다섯 번호 모두 균등 기대값 ${exp.toFixed(1)}개에서 ±4개 안쪽이라, 번호별 차이는 우연으로 생길 수 있는 수준입니다. 수능은 홀수형 기준입니다.</p></div>
    <div class="two">
      <div class="card card-pad"><h2>번호별 누적 정답 수</h2><p class="sub">136문항 전체 · 점선은 다섯 번호가 똑같이 나올 때의 값입니다.</p>${totHtml}</div>
      <div class="card card-pad"><h2>회차별 정답 번호 수</h2><p class="sub">회차당 17문항 · 굵은 숫자가 그 회차에서 가장 많은 번호입니다.</p>
        <div class="tscroll"><table class="dt"><thead><tr><th>회차</th>${th5}</tr></thead><tbody>${exRows}<tr class="sum"><th>합계</th>${K.map(k=>`<td>${total[k]}</td>`).join('')}</tr></tbody></table></div></div></div>
    <div class="card card-pad"><h2>회차가 쌓일 때의 누적 추이</h2><p class="sub">25학년도 6월부터 차례로 더한 값 · 점선은 균등 기대값(회차당 3.4개)입니다.</p>
      <div class="legend2">${K.map(k=>`<span><i style="background:${S(k)}"></i>${CIR[k]}</span>`).join('')}</div>${svg}
      <details><summary>표로 보기</summary>${cumTable}</details></div>
    <div class="card card-pad"><h2>정답표</h2><p class="sub">PDF에 실린 정답 · 짝수형 정답이 따로 적힌 수능 문항은 '짝'으로 표시했습니다.</p>
      <div class="tscroll"><table class="dt"><thead><tr><th>회차</th>${NUMS.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${keyRows}</tbody></table></div></div>
    <div class="two">
      <div class="card card-pad heat"><h2>문항 번호별 정답 분포</h2><p class="sub">같은 번호가 8회 중 몇 번 그 정답이었는지 · 진할수록 많습니다.</p>
        <div class="tscroll"><table class="dt"><thead><tr><th>번호</th>${th5}</tr></thead><tbody>${heat}</tbody></table></div></div>
      <div class="card card-pad"><h2>유형별 정답 번호 수</h2><p class="sub">유형은 문항 번호로 묶었습니다.</p>
        <div class="tscroll"><table class="dt"><thead><tr><th>유형</th>${th5}<th>문항</th></tr></thead><tbody>${typeRows}</tbody></table></div></div></div>
    <div class="card card-pad"><h2 style="margin-bottom:10px">읽을 때 주의할 점</h2><ol class="notes">
      <li>이 표는 독해 17문항만 셉니다. 18–20번, 25–29번, 43–45번과 듣기 문항은 PDF에 없어서 빠졌습니다. 회차별 개수는 시험 전체의 정답 배분과 다릅니다.</li>
      <li>번호별 개수(${K.map(k=>total[k]).join(', ')})에 카이제곱 적합도 검정을 하면 χ²=1.13, 자유도 4, p≈0.89입니다. 다섯 번호가 같은 확률로 나온다고 봐도 이상하지 않은 결과입니다.</li>
      <li>문항 번호별 분포는 번호마다 8개뿐이라 표본이 매우 작습니다. 35번은 8회 모두 ④였고, 30번은 ④·⑤, 42번은 ⑤가 많았습니다. 지난 8회분의 기록일 뿐이고 다음 시험을 예측하는 근거가 되지 못합니다.</li>
      <li>번호가 바로 이어지는 문항 쌍 ${pairs}개 중 정답이 같은 번호로 연달아 나온 경우는 ${same}번입니다. 무작위라면 약 ${Math.round(pairs/5)}번이 기대됩니다.</li>
      <li>수능은 PDF 시험지 면에 '홀수형'이 찍혀 있어 홀수형 정답을 셌습니다. 짝수형 정답이 따로 적힌 문항은 ${even.length}개(${even.map(e=>`${e.q.ex} ${e.q.n}번`).join(', ')})입니다.</li>
      <li>정답은 업로드한 PDF에 적힌 값이고, 평가원 공식 정답표와는 대조하지 않았습니다.</li></ol></div>
  </section>`;
  scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if($('#dlg').classList.contains('open')){if(e.key==='Escape')$('#dlg').classList.remove('open');return}
  if(!cur||e.metaKey||e.ctrlKey)return;
  if(/^[1-5]$/.test(e.key)&&!rec[cur.i]&&!peek){pick=+e.key;renderCtrl()}
  else if(e.key==='Enter'&&!rec[cur.i]&&!peek&&pick)grade();
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Escape')home();
});
const h=location.hash.slice(1),hq=Q.find(q=>q.id===h);
if(hq)open(hq.i);else if(h==='answers')stats();else home();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>offlineStatus()).catch(err=>console.warn('서비스 워커 등록 실패',err))})}
</script>
